services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_ai}
      POSTGRES_USER: ${POSTGRES_USER:-legal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - legal-postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_user} -d ${POSTGRES_DB:-legal_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    ports:
      - "6379:6379"
    profiles: ["optional"]

volumes:
  legal-postgres-data:
