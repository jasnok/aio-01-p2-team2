name: test

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      BACKEND_MOCK_MODE: "true"
      LLM_PROVIDER: mock
      REDIS_ENABLED: "false"
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      RUN_REDIS_INTEGRATION: redis://127.0.0.1:6379/0
      RUN_POSTGRES_INTEGRATION: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
